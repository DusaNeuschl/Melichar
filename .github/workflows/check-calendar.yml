name: Melichar - Calendar

on:
  schedule:
    # Cron na GitHub Actions bezi v UTC, ktore neposuva letny cas - preto su
    # rana dve: 05:00 UTC = 07:00 Prahy v lete, 06:00 UTC = 07:00 Prahy v zime.
    # Ktory z nich posle dennu agendu rozhoduje skript podla miestneho casu
    # (prvy beh od 07:00 Prahy, raz za den) - druhy beh je uz len kontrola zmien.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    # Poobede a podvecer - iba kontrola zmien.
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run calendar check
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALENDAR_REFRESH_TOKEN: ${{ secrets.GOOGLE_CALENDAR_REFRESH_TOKEN }}
          RUN_TYPE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check-calendar.mjs

      - name: Commit updated state
        run: |
          git config user.name "melichar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendar-state.json
          git diff --cached --quiet || git commit -m "chore: update calendar state"
          git push
