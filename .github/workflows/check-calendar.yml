name: Melichar - Calendar

on:
  # Hlavny spustac rannej agendy: Cloudflare Worker o 07:00 Prahy (presne).
  # GitHub cron sa tu oneskoroval aj o 5 hodin, preto nie je spolahlivy budik.
  repository_dispatch:
    types: [melichar-morning]

  schedule:
    # Zaloha a kontrola zmien pocas dna. Keby ranny signal z Workera nedorazil,
    # agendu posle prvy z tychto behov po 07:00 Prahy (skript to strazi cez
    # lastAgendaDate, takze dvakrat za den nepride).
    #
    # Minuta zamerne NIE JE ':00' - zaciatok hodiny GitHub odklada najviac.
    - cron: '23 5,6,7 * * *'
    - cron: '23 11,15 * * *'
  workflow_dispatch: {}

# Ranny signal a zalozny cron sa mozu stretnut. Bez serializacie by oba nacitali
# stav pred zapisom toho druheho a agenda by prisla dvakrat.
concurrency:
  group: melichar-calendar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run calendar check
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALENDAR_REFRESH_TOKEN: ${{ secrets.GOOGLE_CALENDAR_REFRESH_TOKEN }}
          # Len rucne "Run workflow" je manualny beh (posle agendu vzdy a neznaci
          # ju). Ranny signal z Workera sa sprava ako planovany beh.
          RUN_TYPE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'scheduled' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check-calendar.mjs

      # Bezi aj ked skript spadne. Agenda sa odosiela ako prva a lastAgendaDate sa
      # uklada hned po nej - keby sa pri pade neuklada, kazdy dalsi beh v ten den
      # by agendu poslal znova (stalo sa 16. 9. 2026).
      - name: Commit updated state
        if: always()
        run: |
          bash .github/commit-state.sh calendar-state.json "chore: update calendar state"
