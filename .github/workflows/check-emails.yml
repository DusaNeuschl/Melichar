name: Melichar - Email Digest

on:
  schedule:
    # Approx. 07:00 / 12:00 / 16:00 Europe/Prague. UTC offset drifts +-1h with DST.
    - cron: '0 6 * * *'
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run email check
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_PERSONAL_REFRESH_TOKEN: ${{ secrets.GMAIL_PERSONAL_REFRESH_TOKEN }}
          GMAIL_WORK_REFRESH_TOKEN: ${{ secrets.GMAIL_WORK_REFRESH_TOKEN }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          OUTLOOK_REFRESH_TOKEN: ${{ secrets.OUTLOOK_REFRESH_TOKEN }}
          SEZNAM_IMAP_USER: ${{ secrets.SEZNAM_IMAP_USER }}
          SEZNAM_IMAP_PASSWORD: ${{ secrets.SEZNAM_IMAP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check-emails.mjs

      - name: Commit updated state
        run: |
          git config user.name "melichar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add email-state.json
          git diff --cached --quiet || git commit -m "chore: update email state"
          git push
