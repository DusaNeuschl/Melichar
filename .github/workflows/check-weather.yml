name: Melichar - Weather Check

on:
  schedule:
    # Priblizne 07:00 / 12:00 / 16:00 Europe/Prague (v lete o hodinu neskor).
    # Presny cas tu nie je kriticky: rozhodnutie sa tyka NADCHADZAJUCEJ noci,
    # takze staci, aby aspon jeden beh presiel pred vecerom. Viac behov znamena
    # len rychlejsiu reakciu, ked sa predpoved cez den zmeni - opakovane spravy
    # o tom istom ochladeni blokuje zoznam uz ohlasenych milnikov v state.json.
    #
    # Minuta ':07' namiesto ':00' - zaciatok hodiny je najvytazenejsi okamih a
    # GitHub vtedy naplanovane behy odklada najviac. ':07' sa zaroven nekryje s
    # kalendarom (':23'), aby si dva behy nezavadzali pri zapise stavu.
    - cron: '7 6,11,15 * * *'
  workflow_dispatch: {}

# Zapisy stavu sa nesmu prekryvat s handle-command.yml - obe menia state.json a
# posledny zapis by prepisal ten druhy.
concurrency:
  group: melichar-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run weather check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Manualny beh je diagnostika - posle prehlad noci a nic neprepne.
          RUN_TYPE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
          LATITUDE: '49.4376699'
          LONGITUDE: '17.9046572'
        run: node scripts/check-weather.mjs

      - name: Commit updated state
        run: bash .github/commit-state.sh state.json "chore: update weather state"
