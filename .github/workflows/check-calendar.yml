name: Melichar - Calendar

on:
  schedule:
    # Cron na GitHub Actions bezi v UTC, ktore neposuva letny cas - preto su
    # rana dve: 05:xx UTC = 07:00 Prahy v lete, 06:xx UTC = 07:00 Prahy v zime.
    # Ktory z nich posle dennu agendu rozhoduje skript podla miestneho casu
    # (prvy beh od 07:00 Prahy, raz za den) - ostatne behy su uz len kontrola zmien.
    #
    # Minuta zamerne NIE JE ':00'. GitHub sam dokumentuje, ze naplanovane behy sa
    # pri zatazeni odkladaju a najhorsi je zaciatok kazdej hodiny; pozorovane
    # odklady na tomto repe boli 2,5-4,5 h. 07:23 je tretia sanca, keby prve dve
    # prislo na rad az neskoro dopoludnia.
    - cron: '23 5,6,7 * * *'
    # Poobede a podvecer - iba kontrola zmien.
    - cron: '23 11,15 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run calendar check
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALENDAR_REFRESH_TOKEN: ${{ secrets.GOOGLE_CALENDAR_REFRESH_TOKEN }}
          RUN_TYPE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check-calendar.mjs

      - name: Commit updated state
        run: |
          bash .github/commit-state.sh calendar-state.json "chore: update calendar state"
